name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token is read/write on a public repo; nothing here needs to
# write anything.
permissions:
  contents: read

# Successive pushes to the same branch supersede each other instead of
# queueing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved
      # under us, a SHA cannot. Comments carry the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # `ruff format --check` is intentionally absent: the repo has never
      # been formatted (20 of 29 files would change). Add this step in the
      # same commit as the one-off `ruff format .`, not before — otherwise
      # CI is red from the first push.
      - run: mypy .
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.lock
      # Not a full pip-compile diff: that depends on the Python and
      # pip-tools versions doing the generating, and a false red is worse
      # than a stale lock. This just checks every pin in requirements.txt
      # is actually in the lock — which is what Dependabot would break.
      - name: Check the lock file covers requirements.txt
        run: |
          while read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            pkg="${line%%[*}"; pkg="${pkg%%==*}"; ver="${line##*==}"
            grep -Eqi "^${pkg}(\[[^]]*\])?==${ver}" requirements.lock || {
              echo "requirements.lock is stale for ${pkg}==${ver}"
              echo "regenerate: pip-compile --generate-hashes --output-file=requirements.lock requirements.txt"
              exit 1
            }
          done < requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The threshold is set just under the current figure: it exists to
      # catch a drop, not to chase a number.
      - run: pytest -q --cov=. --cov-fail-under=80

  # Production is Postgres; without this job the `?`→`%s` translation layer
  # in db.py is exercised by nothing (this is how APP-06 reached production
  # as a 500 while the SQLite suite stayed green).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
